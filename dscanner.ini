; DScanner defaults are intentionally retained except where BetterC/RAII idioms
; produce misleading diagnostics or policy is enforced by documentation review.
; Files below use syntax unsupported by D-Scanner 0.15.2 or trigger its
; nonterminating static-analysis visitor. DUB/LDC still checks all of them.
; ignore=examples/logging_demo.d
; ignore=examples/print_demo.d
; ignore=examples/pretty_print_demo.d
; ignore=source/xtb/core/pretty_print.d
; ignore=source/xtb/core/print.d
; ignore=source/xtb/diagnostics/stacktrace_style.d
[analysis.config.StaticAnalysisConfig]
undocumented_declaration_check="disabled"
builtin_property_names_check="enabled"
could_be_immutable_check="disabled"
unused_variable_check="disabled"
length_subtraction_check="disabled"
